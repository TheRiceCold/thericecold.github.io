en:
  page: Home
  description: TheRiceCold's Homepage
  navigate: Navigate
  welcome: Hello there.
  intro:
    - >-
       My name is <b>Dale Walter</b>. I am a sad <b>Emacs</b> user and a tryhard polyglot.
       <br>Well, of course I <b>code</b> and <b>write</b> nodes in <b>Org-mode</b>.
       <br>I also have a lot of strong views, like <b>C++</b> being the <b>superior programming language</b>.<br>
    - >-
       Anyways, this place is a showcase of my professional background, computing works, digital arts,
       <br>as well as my thoughts on many topics, which I publish as blog posts.
       <br>To find out more about this random fella, <a href="about">click here</a>.
  projects:
    label: Featured Projects
    list:
      - >-
        <a href="https://github.com/thericecold/likha">Likhâ</a> -
        A high-performance commandline text editor written from scratch.
      - <a href="https://github.com/thericecold/laro">Larô Engine</a> - A lightweight game engine.
      - >-
        <a href="https://github.com/thericecold/kaizen">Kaizen (Archived)</a> -
        A <b>desktop environment</b> for <b>Hyprland Linux</b>, written with <b>GJS/Ags</b>.
