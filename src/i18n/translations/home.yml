en:
  page: Home
  description: TheRiceCold's Homepage
  jump: Jump to
  welcome: Hello there.
  intro:
    - >-
       My name is <b id="term">Dale Walter</b>. I am a sad <b id="term">Emacs</b> user and a tryhard <b id="term">polyglot</b>.
       <br>Well, of course I <b id="term">code</b> and <b id="term">write</b> nodes in <b id="term">Org-mode</b>.
       <br>I also have a lot of strong views, like <b id="term">C++</b> being the superior <b id="term">programming language</b>.
    - >-
       Anyways, this place is a showcase of my professional background, computing works, <b id="term">digital arts</b>,
       <br>as well as my thoughts on many topics, which I publish as blog posts.
    - To find out more about this random fella, <a href="about">click here</a>.
  projects:
    label: Featured Projects
    list:
      - '<a href="https://github.com/thericecold/zmacs">Config: Zmacs</a> - A <b id="term">Zettelkasten</b> Optimized <b id="term">Emacs</b> Configuration.'
      - '<a href="https://github.com/thericecold/kaizen">Archived 2024: Kaizen</a> – A <b id="term">Unix Desktop Environment</b> for <b id="term">Hyprland</b> written with <b id="term">Ags.</b>'
  recentPosts:
    label: Recent Posts
    list:
      - title: "Emacs: Introduction"
        date: July 18, 2026
        link: en/emacs-intro
      - title: "Agape: The Excellence of Love"
        date: May 23, 2026
        link: en/agape

  glossary:
    - term: dale walter
      title: The developers's name AKA me
      description: >-
        That's just my name. But I'm actual fullname is <b>Dale Walter García Hicban</b>. If you want more information *blushing* about me, just go to the <a href="/about">about page</a> or visit my social media pages below.
      related: [X, Facebook, Instagram, BlueSky, GitHub]
    - term: polyglot
      description: Polyglotism is the ability to communicate fluently in multiple languages. Generally, while bilingualism refers to 2 languages, a polyglot is someone who speaks 5 or more, and a <i>"hyperpolyglot"</i> speaks 6 or more.
      related: [languages]
    - term: emacs
      description: >-
        GNU Emacs is a <b>highly extensible, customizable, and self-documenting, real-time display editor.</b>
        Famous among programmers, writers, and power users.
        Far more than a basic editor, it operates as a full computing environment–capable of managing tasks,
        running terminal emulators, browsing the web, and compiling code–all driven by keyboard shortcuts.
      related: [text editor, org-mode]
    - term: code
      title: Coding 💻
      description: >-
        Coding (or computer programming) is the process of writing sets of instructions, or algorithms, using specialized programming languages. These instructions tell a computer exactly how to perform specific tasks, such as displaying a website, processing data, or running a mobile app.
    - term: write
      description: >-
        A writer is a person who uses written words to communicate ideas, tell stories, or convey information. The title covers anyone who writes, from people keeping personal journals to professional authors, journalists, and screenwriters.
      related: [symbolism]
    - term: org-mode
      title: Org Mode 🦄
      description: >-
        A GNU Emacs major mode for keeping notes, authoring documents, computational notebooks, literate programming,
        maintaining to-do lists, planning projects, and more — in a fast and effective plain text system.
      related: [emacs]
    - term: c++
      title: C++ Programming Language
      description: >-
        C++ is a high-performance, general-purpose programming language widely used for system-level programming, game development, and high-frequency trading. Created by Bjarne Stroustrup as an extension of C, it provides high-level abstractions and low-level memory management.
      related: [programming, game development]
    - term: programming language
      description: >-
        A programming language is an engineered formal language used to direct a computer to execute specific tasks. It acts as a bridge between human logic and machine execution, allowing developers to write software, build applications, and build websites.
      related: [c++]
    - term: digital arts
      description: >-
        Digital art refers to artistic works that use digital technology as an essential part of the creative or presentation process. It is a broad term that covers everything from computer-generated 3D models and digital paintings to interactive installations, virtual reality experiences, and generative art created using software and algorithms
    - term: hyprland
      description: >-
        Hyprland is an independent tiling Wayland compositor written in C++. Noteworthy features of Hyprland include dynamic tiling, tabbed windows, a clean and readable C++ code-base, and a custom renderer that provides window animations, rounded corners, and Dual-Kawase Blur on transparent windows.
      related: [desktop environment, ags]
    - term: unix desktop environment
      description: >-
        A desktop environment (DE) is the graphical user interface that bundles components like windows, taskbars, file managers, and settings. It dictates how your system looks a  nd functions, and you can freely swap it out or mix-and-match applications without reinstalling your OS.
      related: [hyprland, ags]
    - term: ags.
      title: Aylur's GTK Shell
      description: Aylur's GTK Shell (AGS) is a highly customizable framework used to design and build personal Wayland desktop widgets and complete status shells (bars, docks, notification popups, and app launchers). Inspired by similar tools like eww, it is incredibly popular in the Linux <i>"ricing"</i> and customization community, particularly alongside tiling window managers.
      related: [desktop environment, hyprland]

