  glossary:
    - term: programmer
      description: >-
        A programmer is a professional who writes, tests, and
        maintains the code that tells computers and
        software applications how to function.
        They act as a translator, turning human-readable instructions
        into computer-executable languages like
        Python, JavaScript, Java, or C++.
      related:
        - python,
        - javascript,
        - c++,
        - software development,
        - game development,
        - full-stack development,
        - software engineering  
    - term: game development
      description: Game development is the multidisciplinary process of creating a video game. It encompasses every stage of production—from the initial concept, design, coding, and artistry to sound design, testing, and final release. Development can be handled by a single solo developer or a large, specialized studio.
      related: [BSEMC, software engineering]
    - term: full-stack development
      description: >-
        Full-stack web development involves building both the
        <u>front-end</u> (user-facing interface) and
        <u>back-end</u> (server logic and database) of a website.
        It requires mastering HTML/CSS/JavaScript for the client side,
        a server language like Node.js or Python, and
        database management with tools like MongoDB or SQL.
    - term: tagalog
      description: >-
        Tagalog is an Austronesian language native to the ethnic
        Tagalog people, primarily spoken in the Philippines,
        particularly in Manila, Central Luzon, and surrounding provinces.
    - term: bsemc
      title: BSEMC
      description: >-
        BSEMC stands for Bachelor of Science in Entertainment and Multimedia Computing. It is a 4-year degree program that integrates computing principles with creative arts. Students typically specialize in either <u>Game Development</u> or <u>Digital Animation Technology</u>, learning to create interactive software, 2D/3D assets, audio design, and visual effects.
      related: [game development, software engineering]
    - term: university of caloocan city
      title: university of caloocan city (Philippines)
      description: >-
        The University of Caloocan City is a public-type
        local university established in 1971 and
        formerly called Caloocan City Community College and
        Caloocan City Polytechnic College.
      related: [BSEMC, avion school]
    - term: software engineering
      description: >-
        Software engineering is the systematic process of designing,
        developing, testing, and maintaining computer applications.
        It applies engineering principles and computer science
        to build scalable, reliable, and efficient software solutions
        that solve real-world problems.
      related: [avion school, full-stack development, software development]
    - term: avion school
      description: Avion School is an online school that teaches Filipinos to become software engineers globally. An online course that teaches how actual software engineers work through personalized hands-on projects.
      related: [software engineering, full-stack development, software development]
    - term: elisp
      title: Emacs Lisp
      description: Emacs Lisp is a dialect of the Lisp programming language used specifically to configure, extend, and program the GNU Emacs text editor. It acts as both the extension language and the primary implementation language for the editor; most of Emacs' built-in features (like Org-mode and Magit) are written entirely in Elisp.
    - term: javascript
      description: JavaScript (JS) is a lightweight, text-based programming language primarily used to create interactive and dynamic content on websites. Alongside HTML (which structures web content) and CSS (which designs its appearance), JavaScript serves as the third core technology powering the modern World Wide Web.
    - term: python
      description: Python is a highly versatile, beginner-friendly programming language famous for its clean, English-like syntax and emphasis on readability. It is widely used for web development, data analysis, automation, and artificial intelligence.
    - term: gen z
      description: Generation Z  refers to the demographic cohort of individuals born between <u>1997</u> and <u>2012</u>. Known as true <i>"digital natives,"</i> they were raised with smartphones, social media, and Web 2.0. This generation is highly pragmatic, socially conscious, and places a strong emphasis on mental health and inclusivity.
    - term: ❥ read more (if you want)
      title: More about me
      description: >-
        I haven't written much about my skills in arts.
        And you might be wondering why I only have a few drawings
        and almost all of them are quite old.<br>
