(--bg);border:0 solid var(--fg);pointer-events:auto}.b{padding:0 18px;border-width:0 1px 1px 0;border-radius:0 0 16px 0;font:400 1.1rem/1.05 var(--se);letter-spacing:-.01em}.nv{gap:6px;min-width:0;padding:0 12px 0 16px;border-width:0 0 1px 1px;border-radius:0 0 0 16px}nav{display:flex;gap:6px;min-width:0;overflow-x:auto;scrollbar-width:none}#tg,nav a{flex:none;font:inherit;font-size:.8rem;line-height:1;padding:8px 13px;border-radius:99px}nav a{border:1px solid var(--ln2);background:var(--pill)}nav a.on{border-color:var(--fg)}#tg{border:0;border-radius:10px;background:var(--fg);color:var(--bg);cursor:pointer}#dn{position:fixed;z-index:9;left:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:32px;height:32px;padding:0;border:1px solid var(--fg);border-radius:50%;background:var(--bg);color:var(--fg);font-size:1rem;cursor:pointer}a{color:inherit;text-decoration:none}:focus-visible{outline:2px solid #3b7bff;outline-offset:2px}main{max-width:760px;margin:0 auto;padding:84px 24px 96px}h1,h2,h3{font-family:var(--se);font-weight:400;letter-spacing:-.02em}h1{font-size:clamp(2rem,8vw,3rem);line-height:1.08;margin:0 0 .5em}h2{font-size:1.5rem;line-height:1.2;margin:1.8em 0 .5em}h3{font-size:1.2rem;margin:1.6em 0 .4em}.mut,small{color:var(--mut)}mark{background:var(--hl);color:var(--hlt);padding:0 .1em;-webkit-box-decoration-break:clone;box-decoration-break:clone}.hero h1{font-size:clamp(2.4rem,11vw,4.1rem);margin:8px 0 0}.cr{display:inline-block;width:2px;height:.85em;margin-left:6px;background:#3b7bff;vertical-align:-.05em}@media(prefers-reduced-motion:no-preference){.cr{animation:bl 1.1s steps(1) infinite}}@keyframes bl{50%{opacity:0}}.ill{position:relative;width:min(270px,74%);margin:40px 14px 40px auto}.ill svg{display:block;width:100%;height:auto;fill:none;stroke:var(--fg);stroke-linejoin:round}.ill .s{fill:var(--bg)}.ill .h{fill:var(--hl)}.ill i{position:absolute;width:15px;height:15px;background:var(--k) 50% 0/1px 100%,var(--k) 0 50%/100% 1px;background-repe aph</a></nav><button aria-label="Toggle theme"id=tg><span>Theme </span>◐</button></div></header><main></main><button aria-label="Scroll down"id=dn>↓</button><script>const S=Object.create(null),P=[
{s:'hello-world',t:'Hello, world',d:'2026-01-12',g:['meta'],b:`Welcome. This site is one small file: no framework, no trackers, no web fonts.

I write short notes and link them with wiki links, like [[low-memory-web]] or [[graph-view]]. Open the **Graph** tab to see how they connect.`},
{s:'low-memory-web',t:'Designing for low memory',d:'2026-02-03',g:['perf','web'],b:`Memory goes to DOM nodes, images and framework runtime. Remove those and a page stays tiny.

- Render one view at a time and drop it on navigation
- Use system fonts and inline everything
- Keep large state in typed arrays

The graph in [[graph-view]] follows the same rules. See also [[tiny-tools]].`},
{s:'graph-view',t:'How the graph view works',d:'2026-03-15',g:['dev','web'],b:`Every wiki link like [[hello-world]] becomes an edge. Nodes push each other apart and links pull them together.

\`\`\`js
// positions live in typed arrays, not objects
px[i] += vx[i]
\`\`\`

The simulation sleeps once it settles, so an idle graph costs nothing. Background: [[low-memory-web]].`},
{s:'writing-notes',t:'Notes that link to each other',d:'2026-04-09',g:['writing'],b:`A note is more useful when it points at others. I link every new note to at least one old one, such as [[hello-world]] or [[tiny-tools]].`},
{s:'tiny-tools',t:'Small tools, sharp edges',d:'2026-05-21',g:['dev'],b:`Small programs are easy to finish and easy to keep. Most of my projects start as a weekend script. See [[low-memory-web]] for the constraints I like and [[writing-notes]] for how I document them.`}

const R=[...P].sort((a,b)=>b.d.localeCompare(a.d)),$=q=>document.querySelector(q),M=$('main'),
esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]),
inl=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*]+)\*/g,'<i>$1</i>')
 .replace(/\[\[([^\]]+)\]\]/g,(m,k)=>S[k]?`<a href="#${k}">${S[k].t}</a>`:k)
 .replace(/\[([^\]]+)\]\((https?:[^)\s"]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>'),
md=s=>{let h='',u=0,c=0;for(const l of s.split('\n')){
 if(l.startsWith('```')){h+=c?'</code></pre>':'<pre><code>';c=!c;continue}
 if(c){h+=esc(l)+'\n';continue}
 const li=l.startsWith('- '),m=/^(#{1,3}) (.+)/.exec(l);
 if(u&&!li){h+='</ul>';u=0}
 if(li&&!u){h+='<ul>';u=1}
 h+=m?`<h${m[1].length+1}>${inl(m[2])}</h${m[1].length+1}>`:li?`<li>${inl(l.slice(2))}</li>`:l.trim()?`<p>${inl(l)}</p>`:''}
 return h+(u?'</ul>':'')},

// Graph: one canvas, typed arrays, simulation sleeps when settled; everything is released on navigation.
let G,D;
function graph(){
 M.innerHTML='<h1>Graph</h1><p class="mut">Drag to pan or move a note, pinch or scroll to zoom, tap a note to open it.</p><canvas></canvas>';
 const cv=$('canvas'),c=cv.getContext('2d'),n=P.length,id=new Map(P.map((p,i)=>[p.s,i])),E=[],pt=new Map,
 px=new Float32Array(n),py=new Float32Array(n),vx=new Float32Array(n),vy=new Float32Array(n),dg=new Uint8Array(n),nb=new Uint8Array(n),
 r=Math.min(devicePixelRatio||1,2);
 let w,h,k,ox,oy,al=1,raf=0,hv=-1,dr=-1,mv=0,pd=1;
 P.forEach((p,i)=>{for(const m of p.b.matchAll(/\[\[([^\]]+)\]\]/g)){const j=id.get(m[1]);if(j!=null&&j!=i){E.push(i,j);dg[i]++;dg[j]++}}});
 for(let i=0;i<n;i++){const a=i/n*6.283;px[i]=Math.cos(a)*90+Math.random()*10;py[i]=Math.sin(a)*90+Math.random()*10}
 const size=()=>{const b=cv.getBoundingClientRect();w=b.width;h=b.height;cv.width=w*r;cv.height=h*r},
 draw=()=>{const s=getComputedStyle(document.documentElement),g=v=>s.getPropertyValue(v).trim(),ac=g('--hl'),bg=g('--bg'),fg=g('--fg');
  c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,cv.width,cv.height);c.setTransform(r*k,0,0,r*k,r*ox,r*oy);
  c.lineWidth=1/k;c.strokeStyle=fg;
  for(let e=0;e<E.length;e+=2){const i=E[e],j=E[e+1];c.globalAlpha=hv<0||i==hv||j==hv?.7:.1;c.beginPath();c.moveTo(px[i],py[i]);c.lineTo(px[j],py[j]);c.stroke()}
  c.font='13px Georgia,serif';c.textAlign='center';
  for(let i=0;i<n;i++){const on=hv<0||i==hv||nb[i],q=5+dg[i]*2;c.globalAlpha=on?1:.2;c.fillStyle=on&&(hv>=0||dg[i]>2)?ac:bg;c.beginPath();c.arc(px[i],py[i],q,0,6.283);c.fill();c.stroke();
   
   if(k>.5){c.fillStyle=fg;c.fillText(P[i].t,px[i],py[i]+q+14)}}
  c.globalAlpha=1},
 step=()=>{
  for(let i=0;i<n;i++){for(let j=i+1;j<n;j++){const dx=px[i]-px[j],dy=py[i]-py[j],f=500*al/(dx*dx+dy*dy+1);vx[i]+=dx*f;vy[i]+=dy*f;vx[j]-=dx*f;vy[j]-=dy*f}
   vx[i]-=px[i]*.01*al;vy[i]-=py[i]*.01*al}
  for(let e=0;e<E.length;e+=2){const i=E[e],j=E[e+1],dx=px[j]-px[i],dy=py[j]-py[i],d=Math.hypot(dx,dy)||1,f=(d-70)*.08*al/d;vx[i]+=dx*f;vy[i]+=dy*f;vx[j]-=dx*f;vy[j]-=dy*f}
  for(let i=0;i<n;i++){if(i==dr){vx[i]=vy[i]=0;continue}vx[i]*=.8;vy[i]*=.8;px[i]+=vx[i];py[i]+=vy[i]}
  al*=.985},
 loop=()=>{raf=0;if(al>.02||dr>=0){step();kick()}draw()},
 kick=()=>{raf||(raf=requestAnimationFrame(loop))},
 wp=e=>{const b=cv.getBoundingClientRect();return[(e.clientX-b.left-ox)/k,(e.clientY-b.top-oy)/k]},
 hit=e=>{const[x,y]=wp(e);let b=-1,m=1e9;for(let i=0;i<n;i++){const d=Math.hypot(px[i]-x,py[i]-y);if(d<5+dg[i]*2+8/k&&d<m){m=d;b=i}}return b},
 setHv=i=>{if(i==hv)return;hv=i;nb.fill(0);if(i>=0)for(let e=0;e<E.length;e+=2){if(E[e]==i)nb[E[e+1]]=1;if(E[e+1]==i)nb[E[e]]=1}draw()},
 zoom=(f,cx,cy)=>{const b=cv.getBoundingClientRect(),sx=cx-b.left,sy=cy-b.top,nk=Math.max(.3,Math.min(4,k*f));f=nk/k;ox=sx-(sx-ox)*f;oy=sy-(sy-oy)*f;k=nk;draw()},
 rs=()=>{size();draw()};
 cv.onwheel=e=>{e.preventDefault();zoom(e.deltaY<0?1.1:.9,e.clientX,e.clientY)};
 cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);pt.set(e.pointerId,[e.clientX,e.clientY]);mv=0;
  if(pt.size==1){dr=hit(e);if(dr>=0){setHv(dr);al=Math.max(al,.3);kick()}}
  else{dr=-1;const[a,b]=[...pt.values()];pd=Math.hypot(a[0]-b[0],a[1]-b[1])||1}};
 cv.onpointermove=e=>{const o=pt.get(e.pointerId);
  if(!o){if(e.pointerType=='mouse')setHv(hit(e));return}
  const dx=e.clientX-o[0],dy=e.clientY-o[1];mv+=Math.abs(dx)+Math.abs(dy);o[0]=e.clientX;o[1]=e.clientY;
  if(pt.size==2){const[a,b]=[...pt.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1])||1;zoom(d/pd,(a[0]+b[0])/2,(a[1]+b[1])/2);pd=d}
  else if(dr>=0){const[x,y]=wp(e);px[dr]=x;py[dr]=y;al=Math.max(al,.3)}
  else{ox+=dx;oy+=dy;draw()}};
 cv.onpointerup=cv.onpointercancel=e=>{pt.delete(e.pointerId);
  if(e.type=='pointerup'&&dr>=0&&mv<8&&!pt.size){location.hash=P[dr].s;return}
  dr=-1;if(e.pointerType!='mouse')setHv(-1);kick()};
 size();ox=w/2;oy=h/2;k=Math.min(1.4,Math.min(w,h)/380);
 addEventListener('resize',rs);D=draw;
 G=()=>{cancelAnimationFrame(raf);removeEventListener('resize',rs);cv.width=cv.height=0;D=0};
 kick()}

const go=()=>{const k=location.hash.slice(1)||'home';G&&G();G=D=0;M.replaceChildren();
 const v=V.hasOwnProperty(k)?V[k]:0;
 document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.hash=='#'+(v?k:S[k]?'blog':'home')));
